    <script>
      /* Portable loader + boot diagnostics.
         1) Lets the built game run from ANY folder (GitHub Pages subpaths
            like /dinos/planets/, previews, etc.): Vite injects absolute
            /assets/... tags; we try the page's own folder first, then root.
         2) If files cannot be found, shows a clear on-screen message
            instead of a silent black window. */
      (function () {
        var missing = [];
        function showError() {
          var box = document.getElementById("boot-error");
          if (!box || box.style.display === "block") return;
          var list = missing.length
            ? missing.map(function (f) { return "<code>assets/" + f + "</code>"; }).join(" and ")
            : "the game script";
          box.innerHTML =
            '<div class="be-card">' +
            '<div class="be-face">&#128760;</div>' +
            '<h1>Houston, we have a problem!</h1>' +
            "<p>The planet cannot load because the browser could not find " + list + ".</p>" +
            '<p class="be-fix"><b>How to fix:</b> upload the <b>assets</b> folder right next to ' +
            "<b>planets.html</b> on GitHub Pages, like this:</p>" +
            '<pre>your-folder/\n\u251C\u2500 planets.html\n\u2514\u2500 assets/\n   \u2514\u2500 (all the game files)</pre>' +
            '<p class="be-fix">Then wait ~2 minutes for GitHub to publish and press <b>Ctrl+Shift+R</b> to hard-refresh.</p>' +
            "</div>";
          box.style.display = "block";
        }
        document.addEventListener("DOMContentLoaded", function () {
          var bases = ["./assets/", "/assets/"];
          var items = [];
          document.head
            .querySelectorAll('script[type="module"][src^="/assets/"]')
            .forEach(function (el) {
              items.push({ kind: "js", file: el.getAttribute("src").split("/").pop() });
              el.remove();
            });
          document.head
            .querySelectorAll('link[rel="stylesheet"][href^="/assets/"]')
            .forEach(function (el) {
              items.push({ kind: "css", file: el.getAttribute("href").split("/").pop() });
              el.remove();
            });
          items.forEach(function (item) {
            var done = false;
            (function attempt(i) {
              if (done || i >= bases.length) {
                if (!done) { missing.push(item.file); showError(); }
                return;
              }
              var el;
              if (item.kind === "js") {
                el = document.createElement("script");
                el.type = "module";
                el.src = bases[i] + item.file;
              } else {
                el = document.createElement("link");
                el.rel = "stylesheet";
                el.href = bases[i] + item.file;
              }
              el.onload = function () { done = true; };
              el.onerror = function () { el.remove(); attempt(i + 1); };
              document.head.appendChild(el);
            })(0);
          });
          /* Safety net: files loaded but the app never mounted */
          setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.children.length === 0) showError();
          }, 6000);
        });
      })();
    </script>
