    <script>
      /* Portable loader + boot diagnostics.
         Makes the built game run from ANYWHERE:
           - site root            (/assets/...)
           - GitHub Pages subpath (/dinos/planets/...)
           - double-clicked file  (file:// — browsers block type="module"
                                   there, so we fall back to a classic
                                   <script> tag, which the bundle supports)
         If nothing can load, a clear on-screen message replaces the
         dreaded silent black window. */
      (function () {
        var STEP_TIMEOUT = 1500;
        var missing = [];
        var attempts = [];

        function rootEl() { return document.getElementById("root"); }
        function mounted() { var r = rootEl(); return !!(r && r.children.length); }

        function showError() {
          var box = document.getElementById("boot-error");
          if (!box || box.style.display === "block") return;
          var list = missing.length
            ? missing.map(function (f) { return "<code>assets/" + f + "</code>"; }).join(" and ")
            : "the game files";
          var tried = attempts.length
            ? '<p class="be-fix"><b>What I tried (click a link to check it yourself):</b></p>' +
              '<ul class="be-list">' +
              attempts
                .map(function (a) {
                  return '<li><span class="' + (a.ok ? "be-ok" : "be-bad") + '">' + (a.ok ? "&#10003;" : "&#10007;") +
                    '</span> <a href="' + a.url + '" target="_blank" rel="noopener">' + a.url + "</a></li>";
                })
                .join("") +
              "</ul>" +
              '<p class="be-fix">A <span class="be-bad">&#10007;</span> link that shows a GitHub 404 page means that exact file ' +
              "is missing from your repository. <b>Every &#10007; file must be uploaded</b> — planets.html alone is an empty shell.</p>"
            : "";
          box.innerHTML =
            '<div class="be-card">' +
            '<div class="be-face">&#128760;</div>' +
            '<h1>Houston, we have a problem!</h1>' +
            "<p>The planet cannot load because the browser could not find " + list + ".</p>" +
            tried +
            '<p class="be-fix"><b>Mixing old and new files?</b> Asset filenames change with every build. ' +
            "Delete your old planets folder contents on GitHub and upload <b>planets.html + the whole assets folder " +
            "from the SAME download</b> — never mix files from different downloads.</p>" +
            '<p class="be-fix"><b>If you uploaded to GitHub Pages:</b> the <b>assets</b> folder must sit ' +
            "right next to <b>planets.html</b>, like this:</p>" +
            '<pre>your-folder/\n\u251C\u2500 planets.html\n\u2514\u2500 assets/\n   \u2514\u2500 (all the game files)</pre>' +
            '<p class="be-fix">Then wait ~2 minutes for GitHub to publish and press <b>Ctrl+Shift+R</b>.</p>' +
            '<p class="be-fix"><b>If you double-clicked the file:</b> make sure the <b>assets</b> folder is ' +
            "in the same folder as planets.html, then try opening it in <b>Chrome or Edge</b>. " +
            "Still stuck? Serve the folder instead (e.g. run <code>python3 -m http.server</code> in it " +
            "and visit <code>http://localhost:8000/planets.html</code>).</p>" +
            '<p class="be-url">Page address: <code>' + location.href + "</code></p>" +
            "</div>";
          box.style.display = "block";
        }

        /* Try one way of loading a file; call onOk/onFail exactly once. */
        function attempt(kind, file, base, asModule, onOk, onFail) {
          var el;
          var done = false;
          var timer = null;
          function finish(ok) {
            if (done) return;
            done = true;
            if (timer) clearTimeout(timer);
            attempts.push({ url: (kind === "css" ? el.href : el.src), ok: ok });
            if (!ok) { try { el.remove(); } catch (e) { /* already gone */ } }
            ok ? onOk() : onFail();
          }
          if (kind === "css") {
            el = document.createElement("link");
            el.rel = "stylesheet";
            el.href = base + file;
          } else {
            el = document.createElement("script");
            if (asModule) el.type = "module";
            /* note: deliberately NO crossorigin attribute — with it,
               file:// fetches get CORS-blocked by some browsers. */
            el.src = base + file;
          }
          el.onload = function () { finish(true); };
          el.onerror = function () { finish(false); };
          document.head.appendChild(el);
          /* safety: some failures are silent (e.g. file:// module block) */
          timer = setTimeout(function () { finish(false); }, STEP_TIMEOUT);
        }

        function chain(kind, file, steps, i) {
          if (mounted()) return; /* a previous step already booted the app */
          if (i >= steps.length) {
            if (kind === "js") { missing.push(file); showError(); }
            return;
          }
          attempt(kind, file, steps[i][0], steps[i][1],
            function () { /* loaded */ },
            function () { chain(kind, file, steps, i + 1); });
        }

        document.addEventListener("DOMContentLoaded", function () {
          /* Collect the file names Vite injected, and check whether the
             injected tags already did their job (site-root hosting). */
          var jsFile = null, cssFile = null, cssLoaded = false;
          document.head
            .querySelectorAll('script[type="module"][src*="/assets/"]')
            .forEach(function (el) { jsFile = el.getAttribute("src").split("/").pop(); });
          document.head
            .querySelectorAll('link[rel="stylesheet"][href*="/assets/"]')
            .forEach(function (el) {
              cssFile = el.getAttribute("href").split("/").pop();
              if (el.sheet) cssLoaded = true;
            });
          var jsAlreadyRan = mounted();
          /* Remove the injected tags; our chain re-adds them portably. */
          document.head
            .querySelectorAll('script[type="module"][src*="/assets/"], link[rel="stylesheet"][href*="/assets/"]')
            .forEach(function (el) { el.remove(); });

          var steps = [
            ["./assets/", true],  /* module, page's own folder  */
            ["/assets/", true],   /* module, site root          */
            ["./assets/", false], /* classic, page's own folder (file:// fix) */
            ["/assets/", false]   /* classic, site root         */
          ];
          if (cssFile && !cssLoaded) chain("css", cssFile, steps, 0);
          if (jsFile && !jsAlreadyRan) chain("js", jsFile, steps, 0);

          /* Final safety net: files "loaded" but the app never appeared. */
          setTimeout(function () { if (!mounted()) showError(); }, 6000);
        });
      })();
    </script>
